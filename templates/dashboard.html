<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <title>Dashboard - Mini ERP</title></head>
<body>
    <div class="dashboard-container"
        <h2>Welcome, {{ name }}!</h2>
        <p>Pick a module to get started.</p>
        <div class="dashboard-links">
            <a href="{{ url_for('inventory') }}">Go to Inventory</a>
            <a href="{{ url_for('sales') }}">Go to Sales</a>
            <a href="{{ url_for('purchase') }}">Go to Purchase</a>
            <a href="{{ url_for('hr') }}">Go to HR</a>
            <a href="{{ url_for('logout') }}" class="logout">Logout</a>
        </div>
    </div>
</body>
</html>
