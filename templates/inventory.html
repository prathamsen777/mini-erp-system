<!DOCTYPE html>
<html>
<head><title>Inventory - Mini ERP</title></head>
<body>
    <h2>Inventory</h2>
    <a href="{{ url_for('dashboard') }}">Back to Dashboard</a>
    <br><br>

    <form method="POST" action="{{ url_for('add_product') }}">
        <input type="text" name="name" placeholder="Product name" required>
        <input type="number" name="quantity" placeholder="Quantity" required>
        <input type="number" step="0.01" name="unit_price" placeholder="Unit price" required>
        <button type="submit">Add Product</button>
    </form>

    <br>
    <table border="1" cellpadding="8">
        <tr>
            <th>ID</th><th>Name</th><th>Quantity</th><th>Unit Price</th><th>Action</th>
        </tr>
        {% for p in products %}
        <tr>
            <td>{{ p.id }}</td>
            <td>{{ p.name }}</td>
            <td>{{ p.quantity }}</td>
            <td>{{ p.unit_price }}</td>
            <td><a href="{{ url_for('delete_product', product_id=p.id) }}">Delete</a></td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
